<header class="header js-header ghost -wrap -fzero">
    <div class="ghost__child -full">
        <div class="header__nav -column -column--2of4">
            <div class="header__icon header__list icon-wrap js-controller--navi">
                <span class="icon icon--list">
                    <span class="top"></span>
                    <span class="mid"></span>
                    <span class="bot"></span>
                    <span class="ex1"></span>
                    <span class="ex2"></span>
                </span>
            </div>
        </div>
        <div class="header__utility -column -column--2of4 -text--right">
            <div class="header__icon header__svg -column">
                <a href="/"><%- include( '../partials/svg--logo.html' ) %></a>
            </div>
            <div class="header__icon header__keys -column">
                <span class="icon icon--keys">
                    <span class="up is-disabled"></span>
                    <span class="right js-key-right"></span>
                    <span class="down is-disabled"></span>
                    <span class="left js-key-left"></span>
                </span>
            </div>
            <div class="header__icon header__filter icon-wrap -column js-controller--filter">
                <span class="icon icon--filter">
                    <span class="glass"></span>
                    <span class="handle"></span>
                </span>
            </div>
        </div>
    </div>
</header>
