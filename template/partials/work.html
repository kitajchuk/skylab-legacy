<%
const items = locals.context.get( 'items' );
const tileset = locals.context.get( 'tileset' );
%>
<% if ( tileset ) { %>
    <div class="tileset js-tileset">
        <ul class="tileset__ul grid">
            <% tileset.forEach(( tile ) => { %>
                <%- include( 'index--tile.html', {tile: tile} ) %>
            <% }) %>
        </ul>
    </div>
<% } else { %>
    <%- include( 'features.html', {features: items} ) %>
<% } %>
