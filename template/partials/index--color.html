<li class="colors__li tile -column -column--1of3 -wrap">
    <a href="<%= color.image.doc %>" class="tile__wrap -column" style="padding-bottom:<%= color.image.height / color.image.width * 100 %>%;background-color:<%= color.colors[ 0 ] %>;">
        <img class="tile__photo image js-lazy-image animate animate--slow js-animate" data-img-src="<%= color.image.url %>" data-img-size="[<%= color.image.width %>,<%= color.image.height %>]" />
    </a>
</li>
