<div class="project__body js-project-body">
    <div class="slices">
        <% if ( item.getSliceZone( 'project.slices' ) ) { %>
            <% item.getSliceZone( 'project.slices' ).slices.forEach(( slice ) => { %>
                <div class="slices__slice slices__<%= slice.sliceType %>">
                    <div class="slices__content">
                        <%- include( `../slices/${slice.sliceType}.html`, {slice: slice, item: item} ) %>
                    </div>
                </div>
            <% }) %>
        <% } %>
    </div>
</div>
