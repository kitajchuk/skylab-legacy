<div class="feature js-feature js-cover" data-cover="feature">
    <ul class="feature__ul">
        <% locals.context.get( 'features' ).forEach(( feature ) => { %>
            <%- include( 'index--feature.html', {feature: feature} ) %>
        <% }) %>
    </ul>
</div>
<div class="index js-index">
    <ul class="index__ul">
        <% locals.context.get( 'items' ).forEach(( item ) => { %>
            <%- include( 'index--item.html', {item: item} ) %>
        <% }) %>
    </ul>
</div>
