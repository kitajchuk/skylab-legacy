<div class="index js-index animate js-animate js-animate--intro">
    <ul class="index__ul">
        <% locals.context.get( 'items' ).forEach(( item ) => { %>
            <% if ( item.getText( 'project.type' ) === 'Feature' ) { %>
                <%- include( 'index--feature.html', {item: item} ) %>

            <% } else { %>
                <%- include( 'index--standard.html', {item: item} ) %>
            <% } %>
        <% }) %>
    </ul>
</div>
