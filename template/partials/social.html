<%
const items = locals.context.get( 'items' );
%>
<ul class="social">
<% items.forEach(( item ) => { %>
    <%
    const service = item.getText( 'social.service' ).toLowerCase();
    const url = item.getLink( 'social.url' );
    %>
    <li class="social__link -column">
        <a class="social__icon" href="<%= url.url() %>">
            <%- include( `svg--${service}.html` ) %>
        </a>
    </li>
<% }) %>
</ul>
