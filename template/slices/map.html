<%
const group = slice.value.toArray()[ 0 ];
const url = group.getLink( 'url' );
const map = group.getGeoPoint( 'map' );
%>
<div class="map js-map" data-latlng="[<%= `${map.latitude},${map.longitude}` %>]">
    <div class="map__marker js-map-marker">
        <a href="<%= url.url() %>" target="_blank"><%- include( '../partials/svg--logo.html' ) %></a>
    </div>
</div>
